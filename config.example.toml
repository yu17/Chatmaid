[data]
dir = "data"
hot_window_days = 365

[owner]
name = "Jiaqi"
aliases = ["jiaqi", "fishy"]
extra_addresses = []

[email]
evolution_config_dir = "~/.config/evolution/sources"
evolution_cache_dir = "~/.cache/evolution/mail"
accounts = [
  "2bb8bc493ea9a64e270c733fd29ed16b853eefcb",  # b5a7v1
  "8a19039da6e94f226343e4c2ad4bf97d031a7f8e",  # jiaqi.yu1
  "f71772b19449d2cd7282d5176e2f4178935719e7",  # jxy618.case
  "19f397267c6bc963a9feca8074db17099796fbfd",  # yjq17
  "5cf1ac3f38477a31b4698179ffc7c571355c57af",  # yu17.fishy
]
skip_folders = ["[Gmail]/All Mail", "[Gmail]/Important", "[Gmail]/Starred"]
local_maildir_sent = "~/.local/share/evolution/mail/local/.Sent"

[lmstudio]
base_url = "http://127.0.0.1:40090/v1"
token_file = "LMStudio_token.txt"
model = "qwen3.5-122b-a10b"  # the one local model: triage, summaries, drafts, style, tagging
think = true                 # reasoning on; the JSON schema is enforced on every call
# No sampling parameters here: set temperature, top_p, top_k, min_p and penalties per
# model in LM Studio (My Models > gear), for the mode `think` selects.
model_embedding = "text-embedding-qwen3-embedding-0.6b"
embedding_dim = 1024
timeout_s = 600

[draft]
candidates = 2             # 1..3 candidate replies per draft
recent_messages = 12       # hot-window messages in the context header
memories = 8               # memories per source (direct + vector) in the header
message_chars = 6000       # characters of the incoming message shown to the model
max_age_days = 14          # older incoming mail is triaged informational by rule, never drafted
examples = 3                # the owner's similar past replies shown to the model as tone examples (0 = off)

[cloud]
default_backend = "codex"  # "codex" or "claude"; every call still needs explicit consent
codex_model = "gpt-6-astra"
claude_model = ""          # empty: the claude CLI's default model
timeout_s = 300
redact_amounts = false     # also replace money amounts with [AMOUNT_n] placeholders
