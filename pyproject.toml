[project]
name = "chatmaid"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "openai>=1.60",
  "sqlite-vec>=0.1.6",
  "dbus-fast>=2.30",
  "watchfiles>=1.0",
]

[project.scripts]
chatmaid = "chatmaid.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatmaid"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
